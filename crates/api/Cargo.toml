[package]
name = "sanchoris-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sanchoris"
path = "src/main.rs"

[dependencies]
sanchoris-core.workspace = true
sanchoris-worker.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs", "io-util"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "macros", "uuid", "chrono", "json", "tls-rustls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "aws_lc_rs"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"

[dev-dependencies]
sanchoris-core = { path = "../core", features = ["test-support"] }
tempfile = "3"
tokio-tungstenite = "0.28"
futures-util = "0.3"
