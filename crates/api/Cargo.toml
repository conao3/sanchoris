[package]
name = "sanchoris-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sanchoris"
path = "src/bin/sanchoris.rs"

[[bin]]
name = "api"
path = "src/bin/api.rs"

[[bin]]
name = "channel"
path = "src/bin/channel.rs"

[[bin]]
name = "channel-authorizer"
path = "src/bin/channel_authorizer.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[[bin]]
name = "relay"
path = "src/bin/relay.rs"

[dependencies]
sanchoris-config.workspace = true
sanchoris-core.workspace = true
sanchoris-graphql.workspace = true
sanchoris-worker.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
async-graphql = "7.2.1"
aws-sdk-ssm = "1"
rust-embed = "8.13"
mime_guess = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"] }
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "aws_lc_rs"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
aws-sdk-apigatewaymanagement = "1"
aws-sdk-ecs = "1"
lambda_http = { version = "1", default-features = false, features = ["apigw_http"] }
lambda_runtime = "1"
futures-util = { version = "0.3", features = ["sink"] }

[dev-dependencies]
sanchoris-core = { path = "../core", features = ["test-support"] }
tempfile = "3"
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }
