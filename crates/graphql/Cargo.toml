[package]
name = "sanchoris-graphql"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[dependencies]
sanchoris-config.workspace = true
sanchoris-core.workspace = true
sanchoris-worker.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
async-graphql = "7.2.1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aes-gcm = "0.11"
base64 = "0.23"

[dev-dependencies]
sanchoris-core = { path = "../core", features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "tests"
path = "tests/main.rs"
