[package]
name = "sanchoris-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[features]
test-support = []

[[bin]]
name = "sanchoris-dynamo-create"
path = "src/bin/dynamo_create.rs"

[dependencies]
sanchoris-config.workspace = true
sanchoris-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
hmac = "0.13"
sha2 = "0.11"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
aws-config = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
  "credentials-process",
  "sso",
] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-s3 = { version = "1", default-features = false, features = [
  "sigv4a",
  "http-1x",
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-sqs = { version = "1", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-scheduler = { version = "1", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }

[dev-dependencies]
sanchoris-core = { path = ".", features = ["test-support"] }

[[test]]
name = "tests"
path = "tests/main.rs"
