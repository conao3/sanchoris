services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sanchoris
      POSTGRES_USER: sanchoris
      POSTGRES_PASSWORD: sanchoris
    ports:
      - "${BIND_HOST:-127.0.0.1}:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanchoris -d sanchoris"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
