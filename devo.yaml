session: sanchoris${SLUG:+-$SLUG}
hook_session_closed: echo "sanchoris dev session closed"
inherit_env:
  - SLUG

tasks:
  - id: db
    cmd: pnpm dynamo:local

  - id: dev
    cmd: >-
      bash -c 'until (exec 3<>/dev/tcp/127.0.0.1/${SANCHORIS_DYNAMO_PORT:?set SANCHORIS_DYNAMO_PORT}) 2>/dev/null; do
      echo "waiting for DynamoDB Local..."; sleep 1; done;
      exec pnpm dev'
