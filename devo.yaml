session: sanchoris${SLUG:+-$SLUG}
hook_session_closed: echo "sanchoris dev session closed; run 'docker compose down' to stop postgres"
inherit_env:
  - SLUG

tasks:
  - id: db
    cmd: docker compose up

  - id: dev
    cmd: "bash -c 'until pg_isready -d \"${DATABASE_URL:-postgres://sanchoris:sanchoris@127.0.0.1:54329/sanchoris}\" >/dev/null 2>&1; do echo \"waiting for postgres...\"; sleep 1; done; PORTLESS_HTTPS=1 exec pnpm dev'"
