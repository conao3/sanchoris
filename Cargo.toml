[workspace]
members = [
  "crates/config",
  "crates/engine",
  "crates/core",
  "crates/worker",
  "crates/graphql",
  "crates/api",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/conao3/sanchoris"

[workspace.dependencies]
sanchoris-config = { path = "crates/config" }
sanchoris-engine = { path = "crates/engine" }
sanchoris-core = { path = "crates/core" }
sanchoris-worker = { path = "crates/worker" }
sanchoris-graphql = { path = "crates/graphql" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

[profile.dev]
debug = "line-tables-only"

[profile.lambda-dev]
inherits = "release"
opt-level = 1
incremental = true
panic = "abort"
strip = "symbols"
