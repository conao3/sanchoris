	The config revision pinned when the task started.
	"""
	configRevision: Int!
	issue: IssueRef
	parent: Task
	children: [Task!]!
	blockedBy: [Task!]!
	"""
	Tasks started from issues this task filed, with their descendants.
	"""
	filedTasks: [Task!]!
	requiredSkills: [RequiredSkillStatus!]!
	skillRuns: [SkillRun!]!
	runs: [Run!]!
	run(number: Int!): Run
	outputs: [Output!]!
	limits: TaskLimits!
	turns: Int!
	costUsd: Float!
}

input TaskFilter {
	statuses: [TaskStatus!]
	triggerId: ID
	skillName: String
	"""
	Only tasks that are not finished.
	"""
	active: Boolean
	"""
	Only tasks that are snoozed (true) or that are not (false).
	"""
	snoozed: Boolean
}

type TaskLimits {
	turns: Int!
	costUsd: Float!
	timeoutSeconds: Int!
	heartbeatSeconds: Int!
	childrenMaxDepth: Int!
	childrenMaxCount: Int!
}

enum TaskStatus {
	PENDING
	RUNNING
	WAITING
	NEEDS_YOU
	SUCCEEDED
	FAILED
	ABORTED
}

type Tenant {
	id: ID!
	slug: String!
	name: String!
	plan: Plan!
	state: TenantState!
	suspendedReason: String
	createdAt: DateTime!
	"""
	The GitHub account the GitHub App is installed on.
	"""
	githubOwner: GitHubOwner
	viewerMember: Member!
	usage: TenantUsage!
	activity: Activity!
	setup: Setup!
	members: [Member!]!
	invitations(state: InvitationState): [Invitation!]!
	integrations: [Integration!]!
	credentials: [Credential!]!
	configs: [Config!]!
	projects: [Project!]!
	sessions: [Session!]!
	changeRequests(state: ChangeRequestState): [ChangeRequest!]!
	triggers: [Trigger!]!
	"""
	Recent trigger events of all triggers, newest first.
	"""
	triggerEvents(limit: Int = 20): [TriggerEvent!]!
	skills: [Skill!]!
	skill(name: String!): Skill
	"""
	The latest 200 tasks that match the filter, ordered with NEEDS_YOU first, then by last update, newest first.
	"""
	tasks(filter: TaskFilter): [Task!]!
	task(id: ID!): Task
	"""
	The latest 200 conversations, most recently updated first.
	"""
	conversations: [Conversation!]!
	conversation(id: ID!): Conversation
	"""
	Audit events, newest first.
	"""
	auditEvents(filter: AuditFilter, limit: Int = 100): [AuditEvent!]!
}

enum TenantState {
	ACTIVE
	SUSPENDED
	"""
	Set by deleteTenant. Mutations, webhooks, triggers and dispatch stop for the tenant until the worker removes it.
	"""
	DELETING
}

type TenantUsage {
	periodStart: DateTime!
	"""
	The end of the period. The counts reset at this time. Null for plans with TOTAL limits.
	"""
	periodEnd: DateTime
	tasksThisPeriod: Int!
	workspaceSecondsThisPeriod: Int!
	"""
	Members plus pending invitations, compared with Plan.memberLimit.
	"""
	seatsUsed: Int!
	"""
	Concurrency slots in use, compared with Plan.concurrencyLimit. A run holds one from its dispatch until its workspace stops, also while its task waits or needs you.
	"""
	liveWorkspaces: Int!
}

enum TransitionKind {
	NEXT
	CHOICE
	DEFAULT
	CATCH
}

type Trigger {
	id: ID!
	name: String!
	state: TriggerState!
	match: TriggerMatch!
	"""
	The YAML of the trigger in the config repository.
	"""
	yaml: String!
	session: Session!
	instruction: String!
	skills: [Skill!]!
	requiredSkills: [Skill!]!
	maxNudges: Int!
	limits: TaskLimits!
	config: Config!
	editUrl: String!
	tasksLast7d: Int!
	"""
	Tasks of this trigger that are not finished, counted up to 200.
	"""
	activeTasks: Int!
	openChangeRequest: ChangeRequest
	events(limit: Int = 20): [TriggerEvent!]!
}

type TriggerEvent {
	id: ID!
	receivedAt: DateTime!
	trigger: Trigger!
	result: TriggerEventResult!
	"""
	Set for SKIPPED and DISCARDED.
	"""
	reason: TriggerEventReason
	"""
	The login that caused the event, such as who added the label.
	"""
	senderLogin: String
	"""
	The started task.
	"""
	task: Task
	"""
	For CHILD_LIMIT, the task whose limit was reached.
	"""
	limitedTask: Task
	idempotencyKey: String!
}

enum TriggerEventKind {
	ISSUE_LABELED
	ISSUE_COMMENT_CREATED
	CHECK_RUN_COMPLETED
	SCHEDULE
}

enum TriggerEventReason {
	"""
	The task tree is over Start.Limits.Children.
	"""
	CHILD_LIMIT
	"""
	The sender is not in the event pattern.
	"""
	SENDER_NOT_ALLOWED
	"""
	More events than the receive limit.
	"""
	RECEIVE_LIMIT
	"""
	A task with the same name exists.
	"""
	DUPLICATE
}

enum TriggerEventResult {
	STARTED
	SKIPPED
	DISCARDED
}

"""
What the EventPattern or ScheduleExpression matches.
"""
type TriggerMatch {
	source: EventSource!
	kind: TriggerEventKind!
	repositories: [String!]!
	labels: [String!]!
	"""
	detail.sender.login values. Empty when the pattern uses author_association.
	"""
	senders: [String!]!
	scheduleExpression: String
	nextRunAt: DateTime
}

enum TriggerState {
	ENABLED
	DISABLED
}

type TriggerTemplate {
	id: ID!
	name: String!
	description: String!
}

enum UsageLimitResume {
	AUTO
	MANUAL
}

type UsageSnapshot {
	takenAt: DateTime!
	fiveHour: UsageWindow
	sevenDay: UsageWindow
}

type UsageWindow {
	"""
	0 to 1
	"""
	utilization: Float!
	resetsAt: DateTime!
}

type User {
	id: ID!
	email: String!
	name: String!
	"""
	The linked GitHub login. Null until the user links GitHub in Settings → Integrations.
	"""
	githubLogin: String
}

type Validation {
	valid: Boolean!
	errors: [ValidationError!]!
}

type ValidationError {
	"""
	The file in the config repository, relative to the config root.
	"""
	path: String!
	line: Int
	column: Int
	message: String!
}

type Viewer {
	user: User!
	memberships: [Member!]!
	"""
	Pending invitations addressed to the viewer's email.
	"""
	invitations: [Invitation!]!
	isOperator: Boolean!
	"""
	The plans the viewer can create a tenant on: the Admin plan alone when the sign-in has a verified @sancode.dev email, otherwise the plans of Query.plans.
	"""
	newTenantPlans: [Plan!]!
}

enum WaitReason {
	SKILL
	USAGE_LIMIT
	"""
	The conversation task finished its turn and waits for the next message.
	"""
	MESSAGE
}

type WarmBuild {
	succeeded: Boolean!
	finishedAt: DateTime!
}

type Workspace {
	platform: String!
	compute: WorkspaceCompute!
	architecture: WorkspaceArchitecture!
	"""
	The ECS capacity provider the workspace runs on (FARGATE_SPOT or FARGATE); null before it launches and for local workspaces.
	"""
	capacityProvider: String
	vcpu: Int!
	memoryMib: Int!
	"""
	Repository names cloned into the workspace.
	"""
	repositories: [String!]!
	branch: String!
	baseCommit: String!
}

enum WorkspaceArchitecture {
	ARM64
	X86_64
}

enum WorkspaceCompute {
	STANDARD
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
}
