"""
An ISO 8601 date-time string in UTC, for example 2026-10-26T14:05:00Z.
"""
scalar DateTime

type Query {
  "The signed-in user, the tenants they belong to and the invitations addressed to them."
  viewer: Viewer!
  "The plans a tenant can choose, ordered by price."
  plans: [Plan!]!
  "A tenant the viewer is a member of. Null when it does not exist or the viewer is not a member."
  tenant(slug: String!): Tenant
  "Operator console. Null unless the viewer is a sanchoris operator."
  operator: Operator
  "Templates offered by New from template on Triggers and by the first-run setup."
  triggerTemplates: [TriggerTemplate!]!
}

type Mutation {
  "Creates a tenant owned by the viewer. A paid plan returns a Stripe Checkout URL and creates the tenant after payment; Free returns the tenant."
  createTenant(input: CreateTenantInput!): CreateTenantPayload!
  "Accepts an invitation addressed to the viewer and returns the new membership."
  acceptInvitation(invitationId: ID!): Member!
  "Starts linking the viewer's GitHub account. Returns the URL of /auth/github to open."
  connectGitHub: RedirectPayload!
  "Unlinks the viewer's GitHub account."
  unlinkGitHub: Viewer!
  "Starts the Slack installation for a tenant. Returns the URL to open."
  connectSlack(tenantId: ID!): RedirectPayload!

  inviteMember(input: InviteMemberInput!): Invitation!
  revokeInvitation(invitationId: ID!): Invitation!
  changeMemberRole(memberId: ID!, role: Role!): Member!
  removeMember(memberId: ID!): ID!

  "Sends the message to the task's agent session and resumes a NEEDS_YOU task."
  resumeTask(input: ResumeTaskInput!): Task!
  "Postpones a NEEDS_YOU or usage-limited task until the given time."
  snoozeTask(taskId: ID!, until: DateTime!): Task!
  "Stops the task. Its status becomes ABORTED."
  stopTask(taskId: ID!): Task!
  "Stops the agent session of a run."
  stopRun(runId: ID!): Run!
  """
  Sends a chat message. With taskId, the message goes to that task's agent session.
  Without taskId, a new chat starts in the given scope ("all" or a project name).
  """
  sendChatMessage(input: SendChatMessageInput!): SendChatMessagePayload!

  setTriggerState(triggerId: ID!, state: TriggerState!): Trigger!
  "Opens a change request on a config repository that adds a trigger from a template."
  proposeTriggerFromTemplate(input: ProposeTriggerInput!): ChangeRequest!

  "Adds a config after checking the repository. Returns the validation errors when the check fails."
  addConfig(input: AddConfigInput!): AddConfigPayload!
  "Reads the config repository again."
  syncConfig(configId: ID!): Config!

  "Saves an API key credential. Subscriptions are connected with the sanchoris CLI."
  addCredential(input: AddCredentialInput!): Credential!
  "Removes an API key, or disconnects a subscription login."
  removeCredential(credentialId: ID!): ID!

  "Changes the plan. Returns a Stripe Checkout URL when payment is needed."
  changePlan(tenantId: ID!, planId: ID!): ChangePlanPayload!
  "Returns the URL of the Stripe customer portal."
  openBillingPortal(tenantId: ID!): RedirectPayload!
  "Returns a short-lived URL of the audit log as JSON Lines."
  exportAuditLog(tenantId: ID!, filter: AuditFilter): RedirectPayload!

  "Operator only."
  suspendTenant(tenantId: ID!, reason: String!): Tenant!
  "Operator only."
  unsuspendTenant(tenantId: ID!): Tenant!
}

type RedirectPayload {
  url: String!
}


