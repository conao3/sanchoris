query Chat($tenant: String!, $conversation: ID!, $withConversation: Boolean!) {
  tenant(slug: $tenant) {
    id
    name
    configs {
      id
      status
    }
    sessions {
      id
      name
      config {
        id
      }
      agent
      model
      repositories
      githubRepositories
      callableSkills {
        id
        name
        description
      }
    }
    conversations {
      id
      title
      kind
      sessionName
      updatedAt
      latestTask {
        id
        status
        waitReason
      }
      filedTasks {
        id
      }
    }
    conversation(id: $conversation) @include(if: $withConversation) {
      id
      title
      kind
      sessionName
      interactionMode
      runtimeMode
      context {
        usedTokens
        maxTokens
      }
      createdBy {
        id
        user {
          id
          name
        }
      }
      session {
        id
        name
        repositories
        autoCompact {
          idleMinutes
          contextPercent
        }
      }
      working {
        startedAt
        work {
          ...ChatWorkFields
        }
        question {
          ...ChatQuestionFields
        }
        approval {
          ...ChatApprovalFields
        }
        plan {
          ...ChatPlanFields
        }
        partial {
          kind
          text
          at
        }
        startup {
          workspaceStartedAt
          connectedAt
        }
      }
      latestTask {
        id
        status
        waitReason
        conversationSequence
        runs {
          id
          number
        }
      }
      messages {
        id
        authorKind
        text
        delivery
        attachments {
          id
          name
          mimeType
          url
        }
        outcome
        proposedPlan
        at
        work {
          ...ChatWorkFields
        }
        diff {
          patch
          truncated
          files {
            repo
            path
            additions
            deletions
          }
        }
        member {
          id
          user {
            id
            name
          }
        }
        issues {
          repository
          number
          title
          url
          task {
            id
            blockedBy {
              id
              issue {
                number
              }
            }
          }
        }
      }
      filedTasks {
        id
        title
        status
        waitReason
        issue {
          repository
          number
        }
        trigger {
          id
          name
        }
        parent {
          id
          issue {
            number
          }
        }
        blockedBy {
          id
          issue {
            number
          }
        }
        requiredSkills {
          state
          latestRun {
            id
            status
            currentState
            handoffs
          }
        }
      }
    }
  }
}

fragment ChatQuestionFields on ChatQuestion {
  id
  askedAt
  items {
    id
    header
    question
    multiSelect
    options {
      label
      description
    }
  }
  answers {
    questionId
    answers
  }
}

fragment ChatWorkFields on ChatWork {
  kind
  at
  text
  tool {
    name
    input
    output
    isError
  }
  question {
    ...ChatQuestionFields
  }
  plan {
    ...ChatPlanFields
  }
  approval {
    ...ChatApprovalFields
  }
}

fragment ChatPlanFields on ChatPlan {
  explanation
  steps {
    text
    status
  }
}

fragment ChatApprovalFields on ChatApproval {
  id
  kind
  toolName
  detail
  reason
  decision
  askedAt
}

mutation UploadChatAttachment($input: UploadChatAttachmentInput!) {
  uploadChatAttachment(input: $input) {
    id
    name
    mimeType
    sizeBytes
  }
}

mutation RewindChat(
  $tenantId: ID!
  $conversationId: ID!
  $messageId: ID!
  $restoreFiles: Boolean!
) {
  rewindChat(
    tenantId: $tenantId
    conversationId: $conversationId
    messageId: $messageId
    restoreFiles: $restoreFiles
  ) {
    conversation {
      id
    }
    text
    attachments {
      id
      name
      mimeType
      url
    }
  }
}

mutation ForkChatConversation($tenantId: ID!, $conversationId: ID!, $messageId: ID!) {
  forkChatConversation(
    tenantId: $tenantId
    conversationId: $conversationId
    messageId: $messageId
  ) {
    id
  }
}

mutation SteerChatMessage($tenantId: ID!, $conversationId: ID!, $messageId: ID!) {
  steerChatMessage(tenantId: $tenantId, conversationId: $conversationId, messageId: $messageId) {
    id
  }
}

mutation RemoveQueuedChatMessage($tenantId: ID!, $conversationId: ID!, $messageId: ID!) {
  removeQueuedChatMessage(
    tenantId: $tenantId
    conversationId: $conversationId
    messageId: $messageId
  ) {
    id
  }
}

mutation AnswerChatApproval($input: AnswerChatApprovalInput!) {
  answerChatApproval(input: $input) {
    id
  }
}

mutation AnswerChatQuestion($input: AnswerChatQuestionInput!) {
  answerChatQuestion(input: $input) {
    id
  }
}

mutation InterruptChat($tenantId: ID!, $conversationId: ID!) {
  interruptChat(tenantId: $tenantId, conversationId: $conversationId) {
    id
  }
}

query ChatLive($tenant: String!, $conversation: ID!) {
  tenant(slug: $tenant) {
    id
    conversation(id: $conversation) {
      id
      working {
        startedAt
        work {
          ...ChatWorkFields
        }
        question {
          ...ChatQuestionFields
        }
        approval {
          ...ChatApprovalFields
        }
        plan {
          ...ChatPlanFields
        }
        partial {
          kind
          text
          at
        }
        startup {
          workspaceStartedAt
          connectedAt
        }
      }
    }
  }
}
