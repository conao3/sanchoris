query Chat($tenant: String!, $conversation: ID!, $withConversation: Boolean!) {
  tenant(slug: $tenant) {
    id
    name
    configs {
      id
      status
    }
    sessions {
      id
      name
      config {
        id
      }
      agent
      model
      repositories
      githubRepositories
      callableSkills {
        id
        name
        description
      }
    }
    conversations {
      id
      title
      kind
      sessionName
      updatedAt
      filedTasks {
        id
      }
    }
    conversation(id: $conversation) @include(if: $withConversation) {
      id
      title
      kind
      sessionName
      createdBy {
        id
        user {
          id
          name
        }
      }
      session {
        id
        name
        repositories
      }
      latestTask {
        id
        status
        waitReason
        conversationSequence
        runs {
          id
          number
        }
      }
      messages {
        id
        authorKind
        text
        at
        member {
          id
          user {
            id
            name
          }
        }
        issues {
          repository
          number
          title
          url
          task {
            id
            blockedBy {
              id
              issue {
                number
              }
            }
          }
        }
      }
      filedTasks {
        id
        title
        status
        waitReason
        issue {
          repository
          number
        }
        trigger {
          id
          name
        }
        parent {
          id
          issue {
            number
          }
        }
        blockedBy {
          id
          issue {
            number
          }
        }
        requiredSkills {
          state
          latestRun {
            id
            status
            currentState
            handoffs
          }
        }
      }
    }
  }
}
