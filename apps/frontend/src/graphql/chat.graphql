query Chat($tenant: String!, $conversation: ID!, $withConversation: Boolean!) {
  tenant(slug: $tenant) {
    id
    name
    configs {
      id
      status
    }
    sessions {
      id
      name
      config {
        id
      }
      agent
      model
      repositories
      githubRepositories
      callableSkills {
        id
        name
        description
      }
    }
    conversations {
      id
      title
      kind
      sessionName
      updatedAt
      filedTasks {
        id
      }
    }
    conversation(id: $conversation) @include(if: $withConversation) {
      id
      title
      kind
      sessionName
      createdBy {
        id
        user {
          id
          name
        }
      }
      session {
        id
        name
        repositories
      }
      working {
        startedAt
        work {
          ...ChatWorkFields
        }
        question {
          ...ChatQuestionFields
        }
      }
      latestTask {
        id
        status
        waitReason
        conversationSequence
        runs {
          id
          number
        }
      }
      messages {
        id
        authorKind
        text
        outcome
        at
        work {
          ...ChatWorkFields
        }
        diff {
          patch
          truncated
          files {
            repo
            path
            additions
            deletions
          }
        }
        member {
          id
          user {
            id
            name
          }
        }
        issues {
          repository
          number
          title
          url
          task {
            id
            blockedBy {
              id
              issue {
                number
              }
            }
          }
        }
      }
      filedTasks {
        id
        title
        status
        waitReason
        issue {
          repository
          number
        }
        trigger {
          id
          name
        }
        parent {
          id
          issue {
            number
          }
        }
        blockedBy {
          id
          issue {
            number
          }
        }
        requiredSkills {
          state
          latestRun {
            id
            status
            currentState
            handoffs
          }
        }
      }
    }
  }
}

fragment ChatQuestionFields on ChatQuestion {
  id
  askedAt
  items {
    id
    header
    question
    multiSelect
    options {
      label
      description
    }
  }
  answers {
    questionId
    answers
  }
}

fragment ChatWorkFields on ChatWork {
  kind
  at
  text
  tool {
    name
    input
    output
    isError
  }
  question {
    ...ChatQuestionFields
  }
}

mutation AnswerChatQuestion($input: AnswerChatQuestionInput!) {
  answerChatQuestion(input: $input) {
    id
  }
}

mutation InterruptChat($tenantId: ID!, $conversationId: ID!) {
  interruptChat(tenantId: $tenantId, conversationId: $conversationId) {
    id
  }
}
