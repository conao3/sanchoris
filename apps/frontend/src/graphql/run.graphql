query Run($tenant: String!, $task: ID!, $number: Int!) {
  tenant(slug: $tenant) {
    id
    task(id: $task) {
      id
      title
      conversation {
        id
      }
      issue {
        repository
        number
      }
      run(number: $number) {
        id
        number
        sessionName
        agent
        model
        credentialName
        status
        startedAt
        turns
        costUsd
        workspace {
          platform
          architecture
          capacityProvider
          vcpu
          repositories
          branch
        }
        skillRuns {
          id
          status
          handoffs
          skill {
            id
            name
          }
        }
        outputs {
          id
          kind
          repository
          number
          url
          state
        }
      }
    }
  }
}

query RunLog($tenant: String!, $task: ID!, $number: Int!, $after: Int) {
  tenant(slug: $tenant) {
    id
    task(id: $task) {
      id
      run(number: $number) {
        id
        log(after: $after) {
          sequence
          at
          kind
          text
          rateLimit {
            status
            resetsAt
          }
        }
      }
    }
  }
}

mutation StopRun($runId: ID!) {
  stopRun(runId: $runId) {
    id
    status
  }
}

mutation SendChatMessage($input: SendChatMessageInput!) {
  sendChatMessage(input: $input) {
    conversation {
      id
      updatedAt
    }
    task {
      id
      status
      waitReason
      updatedAt
    }
    message {
      id
      text
      at
    }
  }
}
